name: grayman_flutter
description: GrayMan Android client — mirrors ios/GrayMan.swiftpm (SwiftUI).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  camera: ^0.11.0+2
  video_player: ^2.9.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
